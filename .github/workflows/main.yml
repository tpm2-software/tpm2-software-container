#
# Build Docker Images for both pull_request and push operations
#
name: Build Status
on:
  [ pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  generate-matrix:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v7

      - id: set-matrix
        run: |
          DISTROS=$(find . -maxdepth 1 -name '*.docker.m4' \
            | sed 's|^\./||' \
            | sed 's|\.docker\.m4$||' \
            | grep -Ev '(-dev|-pkcs11)$' \
            | jq -R -s -c 'split("\n")[:-1]')

          MATRIX=$(jq -cn --argjson distros "$DISTROS" '{distro: $distros}')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-image:
    name: Build Docker Images
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      -
        name: Check out the repo
        uses: actions/checkout@v7
      -
        id: changes
        name: Check Diff for Changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            build:
              - ${{ matrix.distro }}.docker.m4
              - ${{ matrix.distro }}-dev.docker.m4
              - ${{ matrix.distro }}-pkcs11.docker.m4
              - modules/*
      -
        name: Build the Dockerfiles
        run: make -j $(nproc)
        if: steps.changes.outputs.build == 'true'
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        if: steps.changes.outputs.build == 'true'
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        if: steps.changes.outputs.build == 'true'
      -
        name: Build Docker Images
        uses: docker/build-push-action@v7
        with:
          push: false
          context: .
          file: ./${{ matrix.distro }}.docker
        if: steps.changes.outputs.build == 'true'
      -
        name: Build Docker Images (-dev)
        uses: docker/build-push-action@v7
        with:
          push: false
          context: .
          file: ./${{ matrix.distro }}-dev.docker
        if: steps.changes.outputs.build == 'true' && hashFiles(format('{0}-dev.docker.m4', matrix.distro)) != ''
      -
        name: Build Docker Images (-pkcs11)
        uses: docker/build-push-action@v7
        with:
          push: false
          context: .
          file: ./${{ matrix.distro }}-pkcs11.docker
        if: steps.changes.outputs.build == 'true' && hashFiles(format('{0}-pkcs11.docker.m4', matrix.distro)) != ''
