#
# We only publish docker files on a push AND if the tpm2-software is the org.
# This way forks don't try to build AND publish
#
name: Publish
on:
  push

permissions:
  contents: read
  packages: write
jobs:
  generate-matrix:
    runs-on: ubuntu-latest

    outputs:
      distros: ${{ steps.set-matrix.outputs.distros }}

    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        run: |
          DISTROS=$(find . -maxdepth 1 -name '*.docker.m4' \
            | sed 's|^\./||' \
            | sed 's|\.docker\.m4$||' \
            | jq -R -s -c 'split("\n")[:-1]')

          echo "distros=$DISTROS" >> $GITHUB_OUTPUT

  publish-image:
    name: Publish Docker Images
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJson(needs.generate-matrix.outputs.distros) }}

    if: "github.repository_owner == 'tpm2-software'"
    steps:
      -
        name: Check out the repo
        uses: actions/checkout@v6
      -
        id: changes
        name: Check Diff for Changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            build:
              - ${{ matrix.distro }}.docker.m4
              - modules/*
      -
        name: Build the Dockerfiles
        run: make -j $(nproc)
        if: steps.changes.outputs.build == 'true'
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        if: steps.changes.outputs.build == 'true'
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        if: steps.changes.outputs.build == 'true'
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: steps.changes.outputs.build == 'true'
      -
        name: Push to GitHub Packages
        uses: docker/build-push-action@v7
        with:
          push: 'true'
          context: .
          file: ./${{ matrix.distro }}.docker
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.distro }}:latest
        if: steps.changes.outputs.build == 'true'
